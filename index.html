  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #0b0b12;
      color: white;
    }

    /* ==============================
       網頁最上方標題
    ============================== */
    .header {
      text-align: center;
      padding: 45px 20px 30px;
      background: linear-gradient(135deg, #101018, #24104d);
    }

    .header h1 {
      margin: 0;
      font-size: 34px;
    }

    .header p {
      margin: 12px 0 0;
      color: #c9c9d8;
      font-size: 16px;
    }

    /* ==============================
       主功能按鈕
    ============================== */
    .tabs {
      width: 92%;
      max-width: 900px;
      margin: 25px auto 0;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tab-button {
      border: 1px solid #39394a;
      background: #171721;
      color: white;
      padding: 14px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .tab-button.active {
      background: #6d3df5;
      border-color: #6d3df5;
    }

    /* ==============================
       內容區域
    ============================== */
    .container {
      width: 92%;
      max-width: 900px;
      margin: 22px auto 60px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 16px;
    }

    /* ==============================
       音樂卡片
    ============================== */
    .music-card {
      background: #171721;
      border: 1px solid #292936;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .music-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .music-info {
      color: #aaaabc;
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* ==============================
       播放器
    ============================== */
    audio {
      width: 100%;
      display: block;
      margin-bottom: 14px;
    }

    /* ==============================
       收藏與下載按鈕
    ============================== */
    .actions {
      display: flex;
      gap: 10px;
    }

    .action-button {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #3a3a4a;
      background: #22222e;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .action-button:hover {
      background: #30303f;
    }

    .favorite-active {
      background: #5b2041;
      border-color: #ff5b9f;
      color: #ff8cba;
    }

    .download-button {
      background: #6239db;
      border-color: #754bf1;
    }

    /* ==============================
       空白提示
    ============================== */
    .empty-message {
      text-align: center;
      background: #171721;
      border: 1px dashed #3a3a4a;
      border-radius: 16px;
      padding: 35px 20px;
      color: #aaaabc;
    }

    /* ==============================
       手機版
    ============================== */
    @media (max-width: 650px) {

      .header {
        padding: 35px 15px 25px;
      }

      .header h1 {
        font-size: 27px;
      }

      .header p {
        font-size: 14px;
      }

      .tabs {
        width: 94%;
        gap: 6px;
      }

      .tab-button {
        font-size: 14px;
        padding: 12px 5px;
      }

      .container {
        width: 94%;
      }

      .music-card {
        padding: 14px;
      }

      .music-title {
        font-size: 18px;
      }

      .actions {
        gap: 7px;
      }

      .action-button {
        font-size: 14px;
        padding: 10px 5px;
      }
    }
  </style>

    /* ==========================================

    function isFavorite(id) {

      return localStorage.getItem(

      ) === "true";

    }


    /* ==========================================
       收藏／取消收藏
    ========================================== */

  function toggleFavorite(id, type, button) {

    const current = isFavorite(id);
    const newFavorite = !current;

    localStorage.setItem(
        "favorite_" + id,
        newFavorite ? "true" : "false"
    );

    // 只更新愛心／星星，不重新載入播放器
 if (type === "effect") {

    // 音效：☆ → ★
    button.textContent = newFavorite ? "★" : "☆";
    button.style.color = newFavorite ? "#ffd54a" : "white";

} else if (type === "splice") {

    // 拼接素材：剪刀，標記後變紫色
    button.textContent = "✂";
    button.style.color = newFavorite ? "#a855f7" : "white";

} else {

    // 音樂：♡ → ♥
    button.textContent = newFavorite ? "♥" : "♡";
    button.style.color = newFavorite ? "#ff4d6d" : "white";

}
    // 收藏頁取消收藏時，直接把這張音樂卡移除
    if (
        currentSection === "favorite" &&
        type === "music" &&
        !newFavorite
    ) {

        const card = button.closest(".music-card");

        if (card) {
            card.remove();
        }
    }
}

// ========================================
// 最多同時播放 2 首音樂
// 第 3 首播放時，自動暫停最早播放的音樂
// ========================================

let playingMusicQueue = [];

function setupMusicPlayLimit(audio) {

    audio.addEventListener("play", function () {

        // 移除已停止或已結束的播放器
        playingMusicQueue = playingMusicQueue.filter(player =>
            player !== audio &&
            player.isConnected &&
            !player.paused &&
            !player.ended
        );

        // 最新播放的放最後面
        playingMusicQueue.push(audio);

        // 超過 2 首，就暫停最早播放的那一首
        while (playingMusicQueue.length > 2) {

            const oldest = playingMusicQueue.shift();

            if (oldest && !oldest.paused) {
                oldest.pause();
            }
        }
    });
}

/* ========================================
   拼接素材：一次只能播放 1 首
======================================== */

let currentSpliceAudio = null;

function setupSplicePlayLimit(audio) {

    audio.addEventListener("play", function () {

        if (
            currentSpliceAudio &&
            currentSpliceAudio !== audio
        ) {
            currentSpliceAudio.pause();
        }

        currentSpliceAudio = audio;

    });

}

        document
          .getElementById("favoriteButton")
          .classList.add("active");

      }


      renderCurrentSection();

    }

        renderSongs(musicSongs);

      `;

    } else {

    }

  }
    }

color:${
    song.type === 'effect'

            : (favorite ? '#ff4d6d' : 'white')
};
    font-size:28px;

    padding:6px;
"
        "

   ${song.type === "effect"
    ? (favorite ? "★" : "☆")
    : song.type === "splice"
        ? "✂"
        : (favorite ? "♥" : "♡")
}
    </button>

</div>

 
        `;


        content.appendChild(card);
const audio = card.querySelector("audio");

if (audio && song.type === "music") {
    setupMusicPlayLimit(audio);
}

        if (audio && song.type === "splice") {
    setupSplicePlayLimit(audio);
}

        
      });




    }


    /* ==========================================
       下載 MP3
    ========================================== */

    function downloadSong(file) {

      const link =
        document.createElement("a");

      link.href = file;

      link.download = file;

      document.body.appendChild(link);

      link.click();

      link.remove();

    }
