<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08192b">
<title>自由品勢音樂素材庫 · WOW 2.0</title>
<style>
:root{color-scheme:dark;--bg:#071828;--card:#142d42;--stroke:#36536a;--neon:#d5ff3d;--white:#f6fbff;--sub:#a9c3d4;--pink:#ff668d;--gold:#ffd45a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:280px;font-family:system-ui,-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif;color:var(--white);background:radial-gradient(ellipse 70% 28% at 8% 3%,#1b5061 0%,transparent 80%),radial-gradient(ellipse 80% 25% at 94% 15%,#284163 0%,transparent 85%),var(--bg);line-height:1.4}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.09;background:repeating-linear-gradient(120deg,transparent 0 52px,#c5ffeb 53px,transparent 54px 104px);z-index:-1}
button,input,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e7ff96;outline-offset:2px}
a{color:inherit}
.app{max-width:1200px;margin:0 auto;padding:12px 13px 100px}
.hero{overflow:hidden;position:relative;border:1px solid #66895d;border-radius:24px;padding:20px 18px 21px;background:radial-gradient(circle at 90% 25%,#1d5964 0%,transparent 45%),linear-gradient(132deg,#142e43,#09243c 75%);box-shadow:0 20px 60px #0005}
.hero:after{content:"";position:absolute;right:-66px;top:-60px;width:210px;height:210px;border:1px solid #d5ff3d50;border-radius:50%;box-shadow:0 0 0 34px #d5ff3d09,0 0 0 70px #d5ff3d07;pointer-events:none;animation:pulse 6s ease-in-out infinite alternate}
.eyebrow{color:var(--neon);font-size:.75rem;font-weight:850;letter-spacing:.16em}.hero h1{font-size:clamp(1.42rem,5vw,2.45rem);line-height:1.24;margin:9px 0 8px;position:relative;z-index:1}.hero p{font-size:.84rem;color:#c5d9e7;margin:0;max-width:35em}
.hero-steps{display:flex;align-items:end;gap:4px;height:32px;margin-top:16px}.hero-steps i{display:block;width:5px;min-height:5px;border-radius:10px;background:var(--neon);animation:bars 1.15s ease-in-out infinite alternate;box-shadow:0 0 11px #d5ff3d88}.hero-steps i:nth-child(3n){animation-delay:.23s}.hero-steps i:nth-child(4n){animation-delay:.53s}.hero-steps i:nth-child(5n){animation-delay:.15s}
@keyframes bars{0%{height:6px;opacity:.55}100%{height:30px;opacity:1}}@keyframes pulse{to{transform:scale(1.14);opacity:.45}}@keyframes entrance{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.toolbar{display:grid;gap:11px;margin:14px 0}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tab{border:1px solid #3b5669;padding:11px 4px;border-radius:12px;color:#dce8f0;background:#173247;font-size:.9rem;font-weight:800;min-width:0}.tab[aria-selected=true]{border-color:#d5ff3d;background:var(--neon);color:#122b3c;box-shadow:0 0 14px #d5ff3d4d}.search-wrap{position:relative}.search-wrap input{width:100%;height:46px;border:1px solid #33576b;border-radius:12px;background:#112d42;color:#fff;padding:0 14px;font-size:.94rem}.search-wrap input::placeholder{color:#a5c1d0}
.headline{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:16px 2px 12px}.headline h2{margin:0;font-size:1.04rem}.count{color:var(--sub);font-size:.8rem}.help{color:var(--sub);font-size:.8rem;margin:4px 3px 12px}
.library{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.track{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;min-width:0;min-height:142px;border:1px solid #365668;border-radius:15px;background:linear-gradient(165deg,#1b3c51,#122b3e);transition:box-shadow .16s,border-color .16s;animation:entrance .4s backwards}
.track.playing{border-color:var(--neon);box-shadow:0 0 0 1px #d5ff3d55,0 0 18px #d5ff3d2b}
.track.unavailable{border-color:#bd6677}
.num{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1;color:var(--neon);text-shadow:0 0 20px #d5ff3d22;white-space:nowrap}
.track-time{font-size:.9rem;font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.track-label{color:#c4d7e1;font-size:.68rem;line-height:1.25;text-align:center;min-height:1.45em;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
.track-actions{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:auto}
.track-actions button{width:36px;height:36px;display:grid;place-items:center;padding:0;border-radius:12px;border:1px solid #4a7182;background:#213c51;color:#fff;font-size:1.32rem;line-height:1}
.track-actions button.play{background:var(--neon);border-color:var(--neon);color:#112838;font-size:1.06rem;font-weight:900}
.track-actions button.fav.active{color:var(--pink);border-color:#f16b8c}
.track-actions button.mark.active{color:var(--gold);border-color:var(--gold)}
.track:after{content:"";position:absolute;bottom:0;left:0;height:3px;width:var(--progress,0%);max-width:100%;background:var(--neon);border-radius:0 0 0 13px;transition:width .2s linear}
.empty{padding:35px 15px;color:var(--sub);text-align:center;background:#142e43;border:1px dashed #3f6172;border-radius:18px}
.editor{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-decoration:none;border-radius:14px;background:var(--neon);color:#142838;font-weight:950;padding:16px;margin:22px 0;box-shadow:0 7px 23px #d5ff3d33}
.footer{text-align:center;color:#89a6bb;font-size:.74rem;margin-top:22px}
.intro{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:radial-gradient(circle at center,#1b5562,#08192b 65%);transition:opacity .45s;pointer-events:auto}
.intro.hide{opacity:0;pointer-events:none}.intro[hidden]{display:none}.intro .intro-logo{font-size:clamp(1.6rem,6vw,3rem);font-weight:950;color:var(--neon);text-align:center;letter-spacing:.08em;text-shadow:0 0 28px #d5ff3d91}.intro small{color:#bcd7df;letter-spacing:.1em}.intro button{background:transparent;color:white;border:1px solid #8aaab6;border-radius:50px;padding:8px 20px}
@media(min-width:650px){.app{padding:25px 28px 90px}.hero{padding:29px 32px}.toolbar{grid-template-columns:1fr 1fr;align-items:center}.library{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.track{min-height:158px;padding:16px 10px}.track-actions button{width:42px;height:42px}.num{font-size:2.75rem}}
@media(max-width:360px){.app{padding-inline:9px}.library{gap:6px}.track{padding:10px 2px;min-height:135px}.track-actions{gap:5px}.track-actions button{width:31px;height:33px}.track-time{font-size:.8rem}.track-label{font-size:.63rem}.tabs{gap:5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

<div class="intro" id="intro" aria-hidden="true"><div class="intro-logo">⚡ WOW 2.0</div><small>自由品勢 · 音樂能量啟動</small><button id="skipIntro" type="button">跳過動畫</button></div>

</div>

// 62 個拼接素材沿用舊版既有檔名格式。
const SPLICE_MATERIALS = Array.from({length:62},(_,i)=>{
  const no=String(i+1).padStart(2,'0');
  return {id:'splice'+no,title:'拼接'+no,file:`拼接素材/${no}_拼接素材.mp3`,info:'短音樂片段',type:'splice'};
});
function getTracks(type){
  if(type==='music'){
    const newest = NEW_MUSIC_BATCHES.flat().map(item=>({...item,type:'music',info:item.info||'純音樂｜自由品勢'}));
    return [...newest,...ORIGINAL_LIBRARY_DATA.filter(s=>s.type==='music')];
  }
  return type==='splice' ? SPLICE_MATERIALS : ORIGINAL_LIBRARY_DATA.filter(s=>s.type==='effect');
}
const $=s=>document.querySelector(s);
const formatTime=seconds=>{
  if(!Number.isFinite(seconds)||seconds<0)return '--:--';
  const value=Math.floor(seconds);
  return String(Math.floor(value/60)).padStart(2,'0')+':'+String(value%60).padStart(2,'0');
};
function saved(id){try{return localStorage.getItem('favorite_'+id)==='true'}catch{return false}}
function toggleSaved(id){try{const next=!saved(id);localStorage.setItem('favorite_'+id,next?'true':'false');return next}catch{return false}}
let selected='music',playQueue=[];
const activeAudio=new Set();
const mediaMap = new Map();
function stopAll(){
  for(const a of activeAudio){a.pause();a.currentTime=0;}
  activeAudio.clear();playQueue=[];mediaMap.clear();
}
function onPlay(audio,kind){
  if(kind==='music'){
    playQueue=playQueue.filter(a=>a!==audio&&!a.paused&&!a.ended&&activeAudio.has(a));
    playQueue.push(audio);
    while(playQueue.length>2){const oldest=playQueue.shift();if(oldest)oldest.pause()}
  } else {
    for(const a of [...activeAudio]){if(a!==audio&&!a.paused)a.pause()}
  }
}
const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
function cardFor(track,index,type){
  const card=make('article','track');
  card.dataset.id=track.id;
  const displayNumber=String(index+1).padStart(2,'0');
  const n=make('div','num',displayNumber);
  const time=make('div','track-time','--:--');time.setAttribute('aria-label','音樂時間');
  const label=make('div','track-label',type==='effect'?track.title.replace(/^\d+\s*/, ''):type==='splice'?'拼接素材':track.info||'自由品勢音樂');
  const buttons=make('div','track-actions');
  const play=make('button','play','▶');play.type='button';play.setAttribute('aria-label',`播放第 ${index+1} 首：${track.title||track.file}`);
  const fav=make('button',type==='effect'?'mark':'fav',type==='effect'?(saved(track.id)?'★':'☆'):type==='splice'?'✂':saved(track.id)?'♥':'♡');
  fav.type='button';fav.setAttribute('aria-label','收藏／標記');
  fav.classList.toggle('active',saved(track.id));
  buttons.append(play,fav);card.append(n,time,label,buttons);
  const audio=new Audio();audio.preload='metadata';audio.src=track.file;
  audio.setAttribute('playsinline','');
  activeAudio.add(audio);mediaMap.set(track.id,audio);
  let hasStarted=false;
  const update=()=>{
    if(!hasStarted || audio.ended)time.textContent=formatTime(audio.duration);
    else time.textContent=formatTime(audio.currentTime);
    if(!audio.paused)card.style.setProperty('--progress',Number.isFinite(audio.duration)&&audio.duration>0?`${Math.min(100,audio.currentTime/audio.duration*100)}%`:'0%');
  };
  audio.addEventListener('loadedmetadata',update);
  audio.addEventListener('durationchange',update);
  audio.addEventListener('timeupdate',update);
  audio.addEventListener('play',()=>{hasStarted=true;card.classList.add('playing');play.textContent='Ⅱ';play.setAttribute('aria-label','暫停第 '+(index+1)+' 首');onPlay(audio,type);update()});
  audio.addEventListener('pause',()=>{card.classList.remove('playing');play.textContent='▶';play.setAttribute('aria-label','繼續播放第 '+(index+1)+' 首');update()});
  audio.addEventListener('ended',()=>{hasStarted=false;card.classList.remove('playing');play.textContent='▶';card.style.setProperty('--progress','0%');update()});
  audio.addEventListener('error',()=>{card.classList.add('unavailable');time.textContent='--:--';play.title='音檔尚未成功載入，請核對檔名與格式'});
  play.addEventListener('click',async()=>{
    if(!audio.paused){audio.pause();return}
    try{if(audio.ended){audio.currentTime=0;hasStarted=false}if(!hasStarted&&Number.isFinite(audio.duration))audio.currentTime=0;
      await audio.play();
    }catch(e){card.classList.add('unavailable');play.title='無法播放，請確認音檔路徑和瀏覽器格式支援';time.textContent='--:--'}
  });
  fav.addEventListener('click',()=>{const isOn=toggleSaved(track.id);fav.classList.toggle('active',isOn);fav.textContent=type==='effect'?(isOn?'★':'☆'):type==='splice'?'✂':isOn?'♥':'♡'});
  return card;
}
function render(){
  stopAll();const container=$('#library');container.replaceChildren();
  const tab=selected==='music'?'🎵 音樂':selected==='splice'?'✂️ 拼接':'⚡ 音效';
  $('#sectionTitle').textContent=tab;
  const tracks=getTracks(selected);
  const q=$('#search').value.trim().toLowerCase();
  // 搜尋編號時使用完整素材清單的固定位置，避免搜尋後出現跳號錯認。
  const matches=tracks.map((t,i)=>({t,i})).filter(({t,i})=>!q||String(i+1).padStart(2,'0').includes(q)||t.title.toLowerCase().includes(q)||t.file.toLowerCase().includes(q)||t.info.toLowerCase().includes(q));
  $('#count').textContent=matches.length+' / '+tracks.length+' 個素材';
  $('#tip').textContent=selected==='music'?'從第一首到最後一首都能單獨試聽 · 最多同時播放兩首':selected==='splice'?'每次試聽一個拼接素材 · 剪刀可以標記':'每次試聽一個音效 · 星星可以標記';
  if(!matches.length){container.append(make('div','empty','沒有符合搜尋的素材'));return}
  for(const {t,i} of matches)container.append(cardFor(t,i,selected));
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  selected=b.dataset.type;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
  $('#search').value='';render();
}));
$('#search').addEventListener('input',render);
const intro=$('#intro');
function dismissIntro(){intro.classList.add('hide');setTimeout(()=>{intro.hidden=true},500)}
$('#skipIntro').addEventListener('click',dismissIntro);
setTimeout(dismissIntro,1350);
render();
</script>
