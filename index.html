
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音樂庫</title>

<style>
:root {
  --bg:#f5f8f5;
  --green:#267f73;
  --ink:#273b3b;
  --muted:#728a83;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,
input:focus-visible,
canvas:focus-visible{
  outline:3px solid #6cc7af;
  outline-offset:2px;
}
.shell{
  max-width:1200px;
  padding:12px 16px 60px;
  margin:auto;
}
.banner{
  display:block;
  width:100%;
  height:auto;
  max-height:420px;
  object-fit:contain;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:0 0 14px;
}
.tab{
  min-width:0;
  background:#fff;
  border:1px solid #d3e6dd;
  border-radius:14px;
  min-height:46px;
  font-weight:750;
  color:#567c72;
}
.tab[aria-selected=true]{
  background:#def2e9;
  color:#176e61;
  border-color:#9bcdbc;
}
.search{
  width:100%;
  height:44px;
  border:1px solid #d3e6dd;
  border-radius:12px;
  padding:0 13px;
  background:#fff;
  color:var(--ink);
  margin:0 0 14px;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:9px;
  margin-bottom:12px;
}
h2{font-size:18px;margin:0}
.upload{
  background:var(--green);
  color:white;
  padding:10px 13px;
  border-radius:22px;
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
  cursor:pointer;
}
.upload input{display:none}
.count{
  font-size:12px;
  color:var(--muted);
  margin:0 0 12px;
}
.cards{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}
.card{
  min-width:0;
  border:2px solid #9fbfb1;
  background:#fff;
  border-radius:20px;
  padding:11px 13px 12px;
  box-shadow:0 14px 28px #173d3230,0 4px 10px #173d321c;
}
.card-head{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:10px;
  min-width:0;
}
.number{
  flex:none;
  background:#e3f3ed;
  color:var(--green);
  border-radius:12px;
  min-width:39px;
  height:39px;
  display:grid;
  place-items:center;
  font-size:19px;
  font-weight:850;
}
.name{
  font-size:15px;
  font-weight:760;
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}
.actions{
  display:flex;
  gap:5px;
  flex:none;
  margin-left:auto;
}
.actions button{
  width:35px;
  height:35px;
  border:1px solid #c9dfd5;
  border-radius:11px;
  background:#f9fcfa;
  color:var(--green);
}
.fav{font-size:25px}
.fav.on{color:#df617e}
.download{font-size:21px}
.player{
  display:flex;
  align-items:center;
  gap:9px;
}
.play{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-size:22px;
  flex:none;
  padding:0;
}
.wave-box{
  height:52px;
  background:#f1f8f5;
  border-radius:11px;
  flex:1;
  min-width:0;
  overflow:hidden;
  touch-action:none;
}
.wave{
  width:100%;
  height:52px;
  display:block;
  touch-action:none;
  cursor:pointer;
}
.times{
  width:48px;
  flex:none;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.now{
  display:block;
  font-weight:850;
  color:#245e53;
  font-size:13px;
}
.total{
  display:block;
  color:#788d85;
  font-size:10px;
  margin-top:3px;
}
.editor{
  display:block;
  text-align:center;
  color:#156c5e;
  background:#e2f5ed;
  border:1px solid #b5decf;
  border-radius:14px;
  text-decoration:none;
  padding:13px;
  margin:22px 0 0;
  font-weight:800;
}
.note{
  text-align:center;
  font-size:11px;
  color:#81948c;
  margin-top:16px;
}

/* 手機一首、平板兩首、電腦三首 */
@media(min-width:650px){
  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(min-width:1120px){
  .cards{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}
@media(max-width:360px){
  .shell{padding-inline:10px}
  .card{padding-inline:9px}
  .name{font-size:13px}
  .player{gap:6px}
  .play{width:42px;height:42px}
  .times{width:42px}
}
</style>
</head>

<body>
<div class="shell">

<header>
  <img
    class="banner"
    src="./music_banner.webp"
    alt="音樂庫：左右跆拳道選手踢腿插畫"
  >
</header>

<nav class="tabs" aria-label="音樂分類">
  <button class="tab" data-kind="music" aria-selected="true">
    🎵 音樂
  </button>
  <button class="tab" data-kind="splice" aria-selected="false">
    ✂️ 拼接
  </button>
  <button class="tab" data-kind="effect" aria-selected="false">
    ⚡ 音效
  </button>
</nav>

<input
  id="search"
  class="search"
  type="search"
  placeholder="搜尋歌曲、編號或音效…"
>

<div class="top">
  <h2 id="heading">音樂清單</h2>
  <label class="upload">
    ＋ 新增音檔
    <input id="upload"
      type="file"
      accept="audio/*,.mp3,.m4a,.wav,.ogg"
      multiple>
  </label>
</div>

<p class="count" id="count"></p>
<main id="cards" class="cards"></main>

<a class="editor"
 href="https://13579jo.github.io/taekwondo-editor/">
 ✂️ 前往自由品勢剪輯器
</a>

<p class="note">
 新增檔案僅在本次瀏覽器頁面預覽；
 正式新增仍須上傳音檔到 GitHub。
</p>

</div>

<script>
'use strict';

// 正式新增音樂時，先上傳到 GitHub，
// 再把資料放入 NEW_MUSIC。
// 舊音檔不必刪除或改名。

const NEW_MUSIC = [];

const BASE =
 'https://13579jo.github.io/taekwondo-music-library/';

const musicFiles = [
 '自由品勢音樂01 (2).mp3',
 'music02.mp3',
 'music03.mp3',
 'music04.mp3',
 'music05.m4a',
 'music06.m4a',
 'music07.m4a',
 'music08.m4a',
 'music09.m4a',
 'music10.m4a',
 'music11.m4a',
 'music12.mp3',
 'music13.mp3',
 'music14.mp3',
 'music15.mp3',
 'music16.m4a',
 'music17.mp3',
 'music18.mp3',
 'music19.mp3',
 'music20.mp3'
];

const effectFiles = [
 '01_強力重擊.wav',
 '02_超重低音衝擊.wav',
 '03_閃電爆擊.wav',
 '04_雷聲.wav',
 '05_戰鼓重擊.wav',
 '06_三連鼓點.wav',
 '07_五連加速鼓點.wav',
 '08_刀劍出鞘.wav',
 '09_刀劍碰撞.wav',
 '10_快速揮刀.wav',
 '11_旋轉Whoosh.wav',
 '12_高速飛踢.wav',
 '13_爆發衝擊.wav',
 '14_低頻上升.wav',
 '15_Drop前下墜.wav',
 '16_水滴.wav',
 '17_東方金屬鐘.wav',
 '18_老鷹提示音.wav',
 '19_神秘閃光.wav',
 '20_終極重擊.wav',
 '21_雷雨震撼長音效.mp3',
 '22_超重低音脈衝長音效.mp3',
 '23_戰鼓進攻節奏長音效.mp3',
 '24_刀劍金屬碰撞長音效.mp3',
 '25_高速咻咻長音效.mp3',
 '26_碎裂衝擊長音效.mp3',
 '27_烈火燃燒長音效.mp3',
 '28_強風暴風長音效.mp3',
 '29_大雨雷鳴長音效.mp3',
 '30_神秘鐘聲長音效.mp3',
 '31_心跳緊張長音效.mp3',
 '32_電影式上升長音效.mp3',
 '33_地鳴低頻長音效.mp3',
 '34_快速踢擊咻聲長音效.mp3',
 '35_連續重擊組合長音效.mp3',
 '36_金屬鎖鏈長音效.mp3',
 '37_水滴節奏長音效.mp3',
 '38_神秘能量長音效.mp3',
 '39_爆破重擊長音效.mp3',
 '40_自由品勢動作長音效.mp3'
];

const number = n => String(n).padStart(2,'0');

const link = file =>
 BASE + file.split('/').map(encodeURIComponent).join('/');

const entry = (id,name,file) => ({
 id,name,file,url:link(file)
});

const tracks = {
 music: [
  ...NEW_MUSIC.map(x=>({...x,url:link(x.file)})),
  ...musicFiles.map((f,i)=>
   entry('music'+number(i+1),'音樂 '+number(i+1),f)
  )
 ],

 splice: Array.from({length:62},(_,i)=>{
  const n=number(i+1);
  return entry(
   'splice'+n,
   '拼接 '+n,
   `拼接素材/${n}_拼接素材.mp3`
  );
 }),

 effect: effectFiles.map((f,i)=>
  entry(
   'effect'+number(i+1),
   f.replace(/^\d+_/,'').replace(/\.(mp3|wav)$/i,''),
   f
  )
 )
};

const $ = s => document.querySelector(s);

let kind='music';
let cardStates=[];
let observer=null;

const running=[];
const favKey='musiclibrary-fav-';

function time(t){
 if(!Number.isFinite(t))return '--:--';
 t=Math.floor(t);
 return number(Math.floor(t/60))+':'+number(t%60);
}

function favorited(id){
 try{
  return localStorage.getItem(favKey+id)==='1';
 }catch{
  return false;
 }
}

function saveFavorite(id,on){
 try{
  localStorage.setItem(favKey+id,on?'1':'0');
 }catch{}
}

function tag(name,cls,text){
 const e=document.createElement(name);
 if(cls)e.className=cls;
 if(text!==undefined)e.textContent=text;
 return e;
}

// 開啟時顯示音波預覽
function preview(id){
 let seed=2166136261;
 for(const c of id){
  seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0;
 }
 return Array.from({length:90},(_,i)=>{
  seed=(Math.imul(seed,1664525)+1013904223)>>>0;
  return .12+.72*((seed>>>8)/16777216)*
   (.55+.45*Math.abs(Math.sin(i*.27)));
 });
}

function draw(canvas,peaks,ratio=0){
 const w=canvas.clientWidth||220;
 const h=52;
 const scale=window.devicePixelRatio||1;

 canvas.width=Math.round(w*scale);
 canvas.height=Math.round(h*scale);

 const ctx=canvas.getContext('2d');
 ctx.setTransform(scale,0,0,scale,0,0);
 ctx.clearRect(0,0,w,h);

 const bar=w/peaks.length;

 peaks.forEach((p,i)=>{
  const height=Math.max(3,p*43);
  ctx.fillStyle=
   i/peaks.length<=ratio?'#267f73':'#9dcabd';

  ctx.fillRect(
   i*bar,
   h/2-height/2,
   Math.max(1,bar-1),
   height
  );
 });
}

// 背景讀取真實音波
const waveQueue=[];
let busyWaves=0;

function enqueueWave(state){
 if(state.closed||state.loading||state.real||state.queued)return;
 state.queued=true;
 waveQueue.push(state);
 processWave();
}

async function processWave(){
 while(busyWaves<2&&waveQueue.length){
  const s=waveQueue.shift();
  if(!s)continue;
  s.queued=false;
  if(s.closed||s.real||s.loading)continue;

  busyWaves++;
  s.loading=true;

  (async()=>{
   try{
    const r=await fetch(s.item.url,{mode:'cors'});
    if(!r.ok)throw Error(r.status);

    const raw=await r.arrayBuffer();
    if(s.closed)return;

    const ac=new (
      window.AudioContext||window.webkitAudioContext
    )();

    let buffer;
    try{
     buffer=await ac.decodeAudioData(raw);
    }finally{
     await ac.close();
    }
    if(s.closed)return;

    const samples=buffer.getChannelData(0);
    const count=90;
    const step=Math.max(
      1,Math.floor(samples.length/count)
    );

    s.peaks=Array.from({length:count},(_,i)=>{
     let top=0;
     const a=i*step;
     const b=Math.min(samples.length,a+step);

     for(
      let j=a;
      j<b;
      j+=Math.max(1,Math.floor(step/50))
     ){
      top=Math.max(top,Math.abs(samples[j]));
     }
     return Math.max(.04,Math.min(1,top));
    });

    s.real=true;

    if(!Number.isFinite(s.audio.duration)){
     s.total.textContent=time(buffer.duration);
    }

    s.paint();
   }catch(e){
    // 讀取失敗時保留預覽音波
   }finally{
    busyWaves--;
    processWave();
   }
  })();
 }
}

// 建立歌曲卡片
function card(item,i){
 const article=tag('article','card');
 const head=tag('div','card-head');

 head.append(tag('div','number',number(i+1)));

 // 舊的20首音樂只顯示編號，不顯示「音樂01」等字樣。
 // 新上傳音樂及音效、拼接素材仍顯示名稱。
 if(kind!=='music'||!/^music\d+$/.test(item.id)){
  head.append(tag('div','name',item.name));
 }

 const actions=tag('div','actions');

 const fav=tag(
  'button',
  'fav',
  favorited(item.id)?'♥':'♡'
 );

 fav.classList.toggle('on',favorited(item.id));
 fav.title='收藏';

 fav.onclick=()=>{
  const on=!favorited(item.id);
  saveFavorite(item.id,on);
  fav.textContent=on?'♥':'♡';
  fav.classList.toggle('on',on);
 };

 const down=tag('button','download','↓');
 down.title='下載歌曲';

 down.onclick=async()=>{
  if(item.local){
   const a=tag('a');
   a.href=item.url;
   a.download=item.file;
   a.click();
   return;
  }

  try{
   const r=await fetch(item.url);
   if(!r.ok)throw Error(r.status);

   const url=URL.createObjectURL(await r.blob());
   const a=tag('a');

   a.href=url;
   a.download=item.file.split('/').pop();
   a.click();

   setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){
   alert('下載失敗，請確認網路、檔案與公開授權。');
  }
 };

 actions.append(fav,down);
 head.append(actions);

 const player=tag('div','player');
 const play=tag('button','play','▶');
 play.title='播放或暫停';

 const box=tag('div','wave-box');
 const wave=tag('canvas','wave');
 wave.tabIndex=0;
 wave.setAttribute('role','slider');
 wave.setAttribute('aria-label','拖曳音波調整播放位置');

 box.append(wave);

 const times=tag('div','times');
 const now=tag('span','now','00:00');
 const total=tag('span','total','--:--');

 times.append(now,total);
 player.append(play,box,times);
 article.append(head,player);

 const audio=new Audio(item.url);
 audio.preload='metadata';
 audio.playsInline=true;

 const state={
  item,
  audio,
  peaks:preview(item.id),
  real:false,
  loading:false,
  queued:false,
  closed:false,
  total,

  paint:()=>draw(
   wave,
   state.peaks,
   Number.isFinite(audio.duration)&&audio.duration>0
    ?audio.currentTime/audio.duration
    :0
  )
 };

 cardStates.push(state);

 const fit=new ResizeObserver(()=>state.paint());
 fit.observe(wave);
 state.fit=fit;
 state.paint();

 const update=()=>{
  now.textContent=time(audio.currentTime);
  if(Number.isFinite(audio.duration)){
   total.textContent=time(audio.duration);
  }
  state.paint();
 };

 audio.onloadedmetadata=update;
 audio.ontimeupdate=update;

 audio.onplay=()=>{
  play.textContent='Ⅱ';
  running.push(audio);

  const max=kind==='music'?2:1;

  while(running.filter(a=>!a.paused).length>max){
   const old=running.find(
    a=>a!==audio&&!a.paused
   );

   if(!old)break;
   old.pause();
  }
 };

 audio.onpause=()=>{
  play.textContent='▶';

  const ix=running.indexOf(audio);
  if(ix>=0)running.splice(ix,1);
 };

 audio.onended=()=>{
  play.textContent='▶';
  audio.currentTime=0;
  update();
 };

 audio.onerror=()=>{
  play.title='無法播放：請檢查檔案路徑和格式';
 };

 play.onclick=async()=>{
  if(!audio.paused){
   audio.pause();
   return;
  }

  try{
   await audio.play();
  }catch(e){
   alert('這首目前無法播放，請確認音檔是否存在及網路連線。');
  }
 };

 // 音波點擊、拖曳跳秒
 const seek=e=>{
  if(!Number.isFinite(audio.duration)||audio.duration<=0)return;

  const r=wave.getBoundingClientRect();

  const x=Math.max(
   0,
   Math.min(1,(e.clientX-r.left)/r.width)
  );

  audio.currentTime=x*audio.duration;
  update();
 };

 wave.addEventListener('pointerdown',e=>{
  wave.setPointerCapture(e.pointerId);
  seek(e);
 });

 wave.addEventListener('pointermove',e=>{
  if(e.buttons)seek(e);
 });

 wave.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
   e.preventDefault();

   audio.currentTime=Math.max(
    0,
    Math.min(
     audio.duration||0,
     audio.currentTime+(e.key==='ArrowRight'?5:-5)
    )
   );

   update();
  }
 });

 if(observer)observer.observe(article);
 article._waveState=state;

 return article;
}

// 顯示分類清單
function render(){
 if(observer)observer.disconnect();

 for(const s of cardStates){
  s.closed=true;
  s.audio.pause();
  s.audio.removeAttribute('src');
  s.fit.disconnect();
 }

 cardStates=[];
 running.length=0;

 const cards=$('#cards');
 cards.replaceChildren();

 const all=tracks[kind];
 const q=$('#search').value.toLowerCase().trim();

 const matches=all
  .map((item,i)=>({item,i}))
  .filter(o=>
   !q||
   o.item.name.toLowerCase().includes(q)||
   o.item.file.toLowerCase().includes(q)||
   number(o.i+1).includes(q)
  );

 $('#heading').textContent=
  kind==='music'?'音樂清單':
  kind==='splice'?'拼接清單':'音效清單';

 $('#count').textContent=
  matches.length+' / '+all.length+' 首';

 observer=new IntersectionObserver(items=>{
  for(const o of items){
   if(o.isIntersecting){
    const s=o.target._waveState;
    if(s)enqueueWave(s);
    observer.unobserve(o.target);
   }
  }
 },{rootMargin:'500px'});

 for(const {item,i} of matches){
  cards.append(card(item,i));
 }

 if(!matches.length){
  cards.append(tag('p','count','找不到符合的歌曲'));
 }
}

document.querySelectorAll('.tab').forEach(b=>{
 b.onclick=()=>{
  kind=b.dataset.kind;

  document.querySelectorAll('.tab').forEach(t=>{
   t.setAttribute(
    'aria-selected',
    String(t===b)
   );
  });

  $('#search').value='';
  render();
 };
});

$('#search').addEventListener('input',render);

// 新增歌曲：本機測試、整批排第一
$('#upload').addEventListener('change',e=>{
 const files=[...e.target.files].filter(f=>
  f.type.startsWith('audio/')||
  /\.(mp3|m4a|wav|ogg)$/i.test(f.name)
 );

 if(files.length){
  const stamp=Date.now();

  const batch=files.map((f,i)=>({
   id:'local'+stamp+'-'+i,
   name:f.name.replace(/\.[^.]+$/,''),
   file:f.name,
   url:URL.createObjectURL(f),
   local:true
  }));

  tracks[kind].unshift(...batch);
  $('#search').value='';
  render();
 }

 e.target.value='';
});

render();
</script>
</body>
</html>
